         à internet. Sem ele, window.BX24 fica undefined e installFinish()
         nunca roda. Protocolo relativo (//) para não quebrar em portal http.
         Fora do Bitrix (URL direta da Vercel), o script simplesmente não
         define BX24 — tratado em InstalacaoBitrix.jsx. -->
